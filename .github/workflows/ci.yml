name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: skill-deck-windows-x64
            args: --bundles nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - runner: macos-latest
            artifact: skill-deck-macos-universal
            args: --target universal-apple-darwin --bundles dmg
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - runner: ubuntu-22.04
            artifact: skill-deck-linux-x86_64
            args: --bundles appimage
            path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify upstream CLI contract
        shell: bash
        run: |
          set -euo pipefail
          contract_test='cli::tests::mutation_argv_matches_the_upstream_noninteractive_contract'
          listed_tests="$(
            cargo test --manifest-path src-tauri/Cargo.toml --all-features --lib "$contract_test" -- --exact --list
          )"
          match_count="$(
            printf '%s\n' "$listed_tests" |
              tr -d '\r' |
              grep -Fxc "$contract_test: test" || true
          )"
          if [ "$match_count" -ne 1 ]; then
            printf 'Expected exactly one Cargo test named %s; found %s.\n' "$contract_test" "$match_count" >&2
            exit 1
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --all-features --lib "$contract_test" -- --exact
      - run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
